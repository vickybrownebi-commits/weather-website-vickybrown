<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather | WeatherNow</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand fw-bold" href="index.html"><img src="png/Group 4.png" alt="" srcset="">
            
            WeatherNow
        </a>

        <!-- MOBILE MENU BUTTON -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAVIGATION -->
        <div class="collapse navbar-collapse" id="mainMenu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="weather.html">
                        Weather
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="posts.html">
                        Weather Posts
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- LOGIN / SIGN UP -->

            <div class="d-flex gap-2">

                <button
                    class="btn btn-outline-light"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                >
                    Login
                </button>

                <button
                    class="btn btn-warning"
                    data-bs-toggle="modal"
                    data-bs-target="#signupModal"
                >
                    Sign Up
                </button>

            </div>

        </div>

    </div>

</nav>


<!-- PAGE TITLE -->
<section class="bg-light py-5">

    <div class="container text-center">

        <h1 class="fw-bold">
            Weather Dashboard
        </h1>

        <p class="text-muted">
            Check weather information for different cities.
        </p>

    </div>

</section>
<!-- SEARCH LOCATION -->
<section class="py-4 bg-white">
    <div class="container">

        <form id="searchForm" class="row justify-content-center g-2">

            <div class="col-md-6">
                <input
                    type="text"
                    id="searchInput"
                    class="form-control form-control-lg"
                    placeholder="Search for a location..."
                >
            </div>

            <div class="col-md-auto">
                <button
                    type="submit"
                    class="btn btn-primary btn-lg"
                >
                    <i class="bi bi-search"></i>
                    Search
                </button>
            </div>

        </form>

        <!-- Error message -->
        <div
            id="searchMessage"
            class="text-center mt-3 text-danger">
        </div>

    </div>
</section>

<!-- WEATHER CARDS -->
<section class="py-5">

    <div class="container">

        <div class="row g-4" id="weatherContainer">
            <!-- JavaScript will put the weather cards here -->
        </div>

    </div>

</section>


<!-- FOOTER -->
<footer class="bg-primary text-white text-center py-4">

    <p class="mb-0">
        © 2026 WeatherNow | All Rights Reserved
    </p>

</footer>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Your JavaScript -->
<script src="js/weather.js"></script>

</body>
</html>
