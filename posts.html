<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Posts | WeatherNow</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand fw-bold" href="index.html"><img src="png/Group 4.png" alt="" srcset="">
            
            WeatherNow
        </a>

        <!-- MOBILE MENU BUTTON -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAVIGATION -->
        <div class="collapse navbar-collapse" id="mainMenu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="weather.html">
                        Weather
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="posts.html">
                        Weather Posts
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- LOGIN / SIGN UP -->

            <div class="d-flex gap-2">

                <button
                    class="btn btn-outline-light"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                >
                    Login
                </button>

                <button
                    class="btn btn-warning"
                    data-bs-toggle="modal"
                    data-bs-target="#signupModal"
                >
                    Sign Up
                </button>

            </div>

        </div>

    </div>

</nav>


<!-- PAGE HEADER -->
<section class="bg-light py-5">

    <div class="container text-center">

        <h1 class="fw-bold">
            Weather Posts
        </h1>

        <p class="text-muted">
            Read the latest weather information and updates.
        </p>

    </div>

</section>


<!-- POSTS -->
<section class="py-5">

    <div class="container">

        <!-- Loading message -->
        <div id="loading" class="text-center">

            <div class="spinner-border text-primary" role="status">
            </div>

            <p class="mt-2">
                Loading posts...
            </p>

        </div>


        <!-- Error message -->
        <div
            id="errorMessage"
            class="alert alert-danger d-none">
        </div>


        <!-- Bootstrap Grid -->
        <div
            id="postsContainer"
            class="row g-4">
        </div>

    </div>

</section>


<!-- FOOTER -->
<footer class="bg-primary text-white text-center py-4">

    <p class="mb-0">
        © 2026 WeatherNow | All Rights Reserved
    </p>

</footer>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Your JavaScript -->
<script src="js/posts.js"></script>

</body>

</html>
